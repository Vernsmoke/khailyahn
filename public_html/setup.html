<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Gym setup</title><link rel="stylesheet" href="/setup.css"><script src="/setup.js" defer></script></head><body><main><h1>Create your first administrator</h1><p>Import the database and configure gym-private/config.php before continuing. There is no default password.</p><form id="setup"><label>Setup token<input name="token" type="password" required minlength="32" autocomplete="off"></label><label>Your name<input name="name" required minlength="2" maxlength="100" autocomplete="name"></label><label>Admin username<input name="username" required minlength="3" maxlength="40" pattern="[a-zA-Z0-9._-]+" autocomplete="username"></label><label>Admin password<input name="password" type="password" required minlength="12" maxlength="128" autocomplete="new-password"></label><button>Create administrator</button><p id="message" role="status"></p></form><p>After successful setup, clear the setup token in the private config and remove setup.html, setup.js, and setup.css.</p><a href="/login">Open sign in</a></main></body></html>
